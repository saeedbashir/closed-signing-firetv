name: container

# Builds the extraction image and pushes it to ECR. Runs only when the AWS
# role secret is configured, so forks and pre-deploy commits do not fail.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/container.yml']

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # Checked out beside this repo; the pipeline lives in its own open-source repo.
  PIPELINE_REPO: saeedbashir/signed-track-manifest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: check
        run: |
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ] || [ -z "${{ secrets.ECR_REPOSITORY }}" ]; then
            echo "AWS_DEPLOY_ROLE_ARN or ECR_REPOSITORY is not set; skipping." >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          repository: ${{ env.PIPELINE_REPO }}
          path: pipeline

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check.outputs.ready == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.check.outputs.ready == 'true'
        id: ecr

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.ready == 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.ready == 'true'
        with:
          context: pipeline
          file: pipeline/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
