  # The full session, 34 minutes, downloaded 2026-09-22 with Saeed's authorisation.
  # The stream URL is the one the event page's Share tab shows; it is served to
  # the page by GET /Player/PlaybackModel/{eventId}, saved beside the file as
  # fmqs-party-leaders-2026-09-17.playbackmodel.json for provenance. Same house
  # crop as the excerpts. This is the title that shows what the excerpts cannot:
  # the interpreter idle during divisions and procedural pauses, which is what the
  # player's auto-dim exists for, and window growth over a whole broadcast rather
  # than two minutes of one.
  - id: sp-fmqs-bsl-2026-09-17-full
    title: "First Minister's Questions (Party Leaders), British Sign Language"
    url: https://www.scottishparliament.tv/meeting/first-ministers-questions-party-leaders-bsl-september-17-2026
    publisher: The Scottish Parliament
    production_credit: "verified: in-house, Scottish Parliament TV"
    licence: "Scottish Parliament Copyright Licence (aligned with OGL-UK-3.0)"
    attribution: "Contains information licensed under the Scottish Parliament Copyright Licence."
    acquisition_route: "publisher's own stream (hlsStreamUrl from /Player/PlaybackModel/{eventId}, as shown on the event page's Share tab)"
    local_path: /Users/saeed.bashir/Desktop/closed-signing/sp-download/fmqs-party-leaders-2026-09-17-full.mp4
    # The Official Report of this item: the publisher's edited-verbatim transcript,
    # aligned to the audio for the verbatim caption track (text unchanged).
    official_report: "https://www.parliament.scot/chamber-and-committees/official-report/search-what-was-said-in-parliament/meeting-of-parliament-17-09-2026?meeting=20233&iob=225812"
    sign_language: bfi
    language_label: British Sign Language
    crop_rect: {x: 1080, y: 108, w: 840, h: 760}
    layout: side-panel
    verdict: candidate
    notes: >-
      Full session, 2048 s. True side panel, so nothing is occluded and no fill is
      needed. House crop checked at t = 2, 60, 600, 1200, 1800, 2000 and 2040 s:
      the panel side reads the same flat backdrop from x=1080 at every one, so the
      rectangle holds from first frame to last. Signing activity: 11 idle stretches
      of 2-8 s over the session (0:24, 4:39, 8:21, 27:28 among them), 42 s in all —
      the title on which the player's auto-dim shows on real content.

  - id: sp-fmqs-bsl-2026-09-17
    title: "First Minister's Questions (Party Leaders), British Sign Language — 2-minute excerpt"
    url: https://www.scottishparliament.tv/meeting/first-ministers-questions-party-leaders-bsl-september-17-2026
    publisher: The Scottish Parliament
    production_credit: "verified: in-house, Scottish Parliament TV"
    licence: "Scottish Parliament Copyright Licence (aligned with OGL-UK-3.0)"
    attribution: "Contains information licensed under the Scottish Parliament Copyright Licence."
    acquisition_route: "publisher's own stream, listed on the event page's Share tab"
    local_path: /Users/saeed.bashir/Desktop/closed-signing/sp-download/fmqs-excerpt.mp4
    sign_language: bfi
    language_label: British Sign Language
    # Hand-measured off a coordinate grid, which is what the gate prescribes for
    # demo titles while automatic bounding sits at 0.727 IoU. The chamber picture
    # ends at x=1080 and the interpreter's panel runs to the right edge; the bands
    # above and below are Parliament branding and belong to neither.
    crop_rect: {x: 1080, y: 108, w: 840, h: 760}
    layout: side-panel
    verdict: candidate
    notes: >-
      A true side panel: nothing is occluded, so no fill is needed. A 120s excerpt
      for testing. SPCB Corporate Identity is not licensed to us, so the crop takes
      the chamber picture and the panel and not the branding.

  # The same clip with no crop_rect, so the detector has to find the panel
  # itself. Exists to answer one question: is automatic extraction good enough
  # to ship, or does the demo have to lean on a hand-measured rectangle?
