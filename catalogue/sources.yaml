    acquisition_route: "publisher's own stream, listed on the event page's Share tab"
    local_path: /Users/saeed.bashir/Desktop/closed-signing/sp-download/sp-b-full.mp4
    sign_language: bfi
    language_label: British Sign Language
    crop_rect: {x: 1080, y: 108, w: 840, h: 760}
    layout: side-panel
    verdict: candidate
    notes: >-
      Full session, 1917 s. True side panel; no fill needed. Signing activity:
      continuous — 16 s under threshold in 32 minutes, 5 of them after the session
      closes. FMQs has no divisions and the interpreter signs the procedural words
      too; auto-dim is correct here and invisible.

