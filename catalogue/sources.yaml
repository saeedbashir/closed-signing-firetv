    attribution: "Contains information licensed under the Scottish Parliament Copyright Licence."
    acquisition_route: "publisher's own stream, listed on the event page's Share tab"
    local_path: /Users/saeed.bashir/Desktop/closed-signing/sp-download/fmqs-excerpt.mp4
    sign_language: bfi
    language_label: British Sign Language
    verdict: candidate
    notes: Comparison against the hand-measured crop of the same source.

