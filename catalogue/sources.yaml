  # extraction is not tuned to one person.
  # Full session, 32 minutes, downloaded 2026-09-22 (same route as the Party
  # Leaders session above). The house crop was checked at seven points from t=2 s
  # to t=1900 s: the panel side reads the same flat backdrop from x=1080 at every
